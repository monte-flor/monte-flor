<header class="max-w-max-width w-full mx-auto px-margin-mobile lg:px-margin-desktop py-space-lg">
<a href="index.html#stay" class="inline-flex items-center gap-space-2xs font-label-md text-label-md text-primary hover:text-primary-container"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Back to Monte Flor</a>
</header>
<main class="flex-1 flex items-center justify-center px-margin-mobile py-space-3xl">
<div class="w-full max-w-md bg-surface-container-lowest p-space-lg md:p-space-xl rounded-2xl shadow-sm border border-outline-variant/40">
<span class="font-label-md text-label-md uppercase tracking-widest text-primary-container">Support the farm</span>
<h1 class="font-headline-lg text-headline-lg text-primary mt-space-3xs mb-space-xs">Support Monte Flor</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-space-lg">Your donation helps us grow seasonal flowers, plant native hedgerows and keep the terraces open for travelers.</p>
<div class="flex flex-col gap-space-md">
  <div class="flex flex-wrap gap-space-xs">
    <button type="button" class="amt-btn px-space-md py-space-xs rounded-full border border-primary text-primary" data-amount="5" data-label="A packet of seeds">€5</button>
    <button type="button" class="amt-btn px-space-md py-space-xs rounded-full border border-primary text-primary" data-amount="10" data-label="Plant 10 ranunculus">€10</button>
    <button type="button" class="amt-btn px-space-md py-space-xs rounded-full border border-primary text-primary" data-amount="25" data-label="Sponsor a dahlia row">€25</button>
  </div>
  <input id="custom-amount" type="number" min="1" step="1" placeholder="Or your own amount (€)"
         class="px-space-md py-space-xs rounded-full border border-outline-variant">
  <button id="paypal-donate" type="button"
          class="px-space-xl py-space-sm rounded-full bg-primary text-on-primary hover:bg-primary-container shadow-md">
    Donate with card or PayPal
  </button>
</div>
</div>
</main>

<script>
  const PAYPAL_ID = 'YOUR_MERCHANT_ID'; // PayPal → Account settings → Business information
  let amount = 0, label = 'Support Monte Flor';

  document.querySelectorAll('.amt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      amount = Number(btn.dataset.amount);
      label = btn.dataset.label;
      document.getElementById('custom-amount').value = '';
      document.querySelectorAll('.amt-btn').forEach(b => {
        b.classList.toggle('bg-primary', b === btn);
        b.classList.toggle('text-on-primary', b === btn);
      });
    });
  });

  document.getElementById('custom-amount').addEventListener('input', e => {
    amount = Number(e.target.value);
    label = 'Support Monte Flor';
    document.querySelectorAll('.amt-btn').forEach(b => b.classList.remove('bg-primary', 'text-on-primary'));
  });

  document.getElementById('paypal-donate').addEventListener('click', () => {
    if (!amount || amount < 1) { alert('Please choose an amount'); return; }
    const params = new URLSearchParams({
      business: PAYPAL_ID,
      amount: amount.toFixed(2),
      currency_code: 'EUR',
      item_name: label,
      no_recurring: '1'   // one-time only, keeps the card-without-account option simple
    });
    window.open('https://www.paypal.com/donate?' + params, '_blank', 'noopener');
  });
</script>
</body></html>
